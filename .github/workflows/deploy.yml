name: "🚀 AWS Infrastructure Deployment"

on:
  push:
    branches:
      - main
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RDS_MASTER_PASSWORD: ${{ secrets.RDS_MASTER_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file="prod.tfvars" \
            -var="database_url=$DATABASE_URL" \
            -var="rds_master_password=$RDS_MASTER_PASSWORD" \
            -out=tfplan

      - name: Upload Plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 5

  terraform-apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: terraform-plan
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RDS_MASTER_PASSWORD: ${{ secrets.RDS_MASTER_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init

      - name: Import existing resources
        run: |
          terraform import module.ecr.aws_ecr_repository.app_repo sinergy-inventario 2>/dev/null || true
          terraform import module.iam.aws_iam_role.apprunner_role sinergy-inventario-apprunner-role 2>/dev/null || true
          terraform import module.iam.aws_iam_role.operations_role sinergy-inventario-operations-role 2>/dev/null || true

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var-file="prod.tfvars" \
            -var="database_url=$DATABASE_URL" \
            -var="rds_master_password=$RDS_MASTER_PASSWORD"