name: "🚀 AWS Infrastructure Deployment"

on:
  push:
    branches:
      - main
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RDS_MASTER_PASSWORD: ${{ secrets.RDS_MASTER_PASSWORD }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file="prod.tfvars" \
            -var="rds_master_password=$RDS_MASTER_PASSWORD" \
            -var="nextauth_secret=$NEXTAUTH_SECRET" \
            -var="superuser_password=$SUPERUSER_PASSWORD" \
            -out=tfplan

      - name: Upload Plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 5

  terraform-apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: terraform-plan
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RDS_MASTER_PASSWORD: ${{ secrets.RDS_MASTER_PASSWORD }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          APP_NAME=$(grep 'app_name' prod.tfvars | head -1 | awk -F '"' '{print $2}')
          SERVICE_STATUS=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='${APP_NAME}'].Status" \
            --output text 2>/dev/null || echo "")

          EXTRA_ARGS=()
          if [ "$SERVICE_STATUS" = "CREATE_FAILED" ]; then
            echo "⚠️  App Runner '$APP_NAME' en CREATE_FAILED — forzando recreación"
            EXTRA_ARGS+=("-replace=module.apprunner.aws_apprunner_service.app_service")
          fi

          terraform apply -auto-approve \
            -var-file="prod.tfvars" \
            -var="rds_master_password=$RDS_MASTER_PASSWORD" \
            -var="nextauth_secret=$NEXTAUTH_SECRET" \
            -var="superuser_password=$SUPERUSER_PASSWORD" \
            "${EXTRA_ARGS[@]}"

      - name: Auto-actualizar nextauth_url si cambió
        run: |
          NEW_URL=$(terraform output -raw app_runner_service_url 2>/dev/null || echo "")
          if [ -z "$NEW_URL" ]; then
            echo "No se pudo obtener la URL del servicio."
            exit 0
          fi

          FULL_URL="https://$NEW_URL"
          CURRENT_URL=$(grep 'nextauth_url' prod.tfvars | awk -F '"' '{print $2}')
          echo "URL actual:  $CURRENT_URL"
          echo "URL nueva:   $FULL_URL"

          if [ "$FULL_URL" = "$CURRENT_URL" ]; then
            echo "✅ URL sin cambios — no se requiere actualización."
            exit 0
          fi

          echo "🔄 URL cambió — actualizando prod.tfvars y re-aplicando..."
          sed -i "s|nextauth_url.*=.*|nextauth_url    = \"$FULL_URL\"|" prod.tfvars

          terraform apply -auto-approve \
            -var-file="prod.tfvars" \
            -var="rds_master_password=$RDS_MASTER_PASSWORD" \
            -var="nextauth_secret=$NEXTAUTH_SECRET" \
            -var="superuser_password=$SUPERUSER_PASSWORD"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add prod.tfvars
          git commit -m "chore: auto-update nextauth_url → $FULL_URL [skip ci]"
          git push

      - name: URL de la aplicación
        run: |
          URL=$(terraform output -raw app_runner_service_url 2>/dev/null || echo "")
          if [ -n "$URL" ]; then
            echo "========================================"
            echo "  🌐  https://$URL"
            echo "========================================"
            echo "url=https://$URL" >> $GITHUB_OUTPUT
          fi