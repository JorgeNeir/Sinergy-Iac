name: "⏸️ Pausar Infraestructura"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "PAUSAR" para confirmar'
        required: true

permissions:
  contents: read

jobs:
  pause:
    name: "Destruir RDS + App Runner"
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'PAUSAR'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      RDS_MASTER_PASSWORD: ${{ secrets.RDS_MASTER_PASSWORD }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init

      - name: Esperar estado estable del servicio
        run: |
          APP_NAME=$(grep 'app_name' prod.tfvars | head -1 | awk -F '"' '{print $2}')
          echo "Verificando estado de App Runner '$APP_NAME'..."
          for i in $(seq 1 20); do
            STATUS=$(aws apprunner list-services \
              --query "ServiceSummaryList[?ServiceName=='${APP_NAME}'].Status" \
              --output text 2>/dev/null || echo "NOT_FOUND")
            echo "Estado actual: $STATUS"
            if [ "$STATUS" != "OPERATION_IN_PROGRESS" ]; then
              echo "✅ Servicio estable — procediendo con destroy."
              break
            fi
            echo "⏳ Operación en curso ($i/20)... esperando 30s"
            sleep 30
          done

      - name: Destruir App Runner y RDS
        run: |
          terraform destroy -auto-approve \
            -target=module.apprunner \
            -target=module.rds \
            -var-file="prod.tfvars" \
            -var="rds_master_password=$RDS_MASTER_PASSWORD" \
            -var="nextauth_secret=$NEXTAUTH_SECRET" \
            -var="superuser_password=$SUPERUSER_PASSWORD"

      - name: Resumen
        run: |
          echo "✅ App Runner y RDS destruidos."
          echo "💡 Se conservaron: ECR (imágenes), VPC, IAM."
          echo "🔄 Para restaurar: ve a Actions → 'AWS Infrastructure Deployment' → Run workflow"
